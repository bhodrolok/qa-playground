<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Health Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <strong id="user-greeting">My health portal</strong>
    <div class="topbar-right"><span class="muted" id="user-email-top"></span></div>
  </header>

  <main class="content">
    <div class="two-col">
      <section class="card">
        <h2>Profile</h2>
        <dl class="profile">
          <dt>Name</dt><dd id="profile-name">…</dd>
          <dt>Email</dt><dd id="profile-email">…</dd>
          <dt>Member since</dt><dd id="member-since">…</dd>
        </dl>
        <button class="btn btn-ghost" id="btn-logout-user">Log out</button>
      </section>

      <section class="card">
        <h2>Book an appointment</h2>
        <label for="book-date">Date</label>
        <input type="date" id="book-date">

        <div id="slots-area" class="slots">
          <p class="muted" id="slots-hint">Pick a date to see available slots.</p>
          <div class="spinner hidden" id="slots-spinner" role="status" aria-label="Loading slots"></div>
          <div id="slot-buttons" class="slot-buttons"></div>
        </div>

        <label for="book-reason">Reason</label>
        <input id="book-reason" placeholder="e.g. Check-up">

        <p id="book-error" class="error hidden"></p>
        <div class="actions">
          <button class="btn btn-primary" id="btn-book" disabled>Book appointment</button>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>My appointments</h2>
      <div class="toolbar">
        <button class="btn" id="btn-refresh-appts">Refresh</button>
      </div>
      <table class="table" id="my-appts">
        <thead><tr><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th></th></tr></thead>
        <tbody id="my-appts-body"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>

    <div class="two-col">
      <section class="card">
        <h2>Notifications</h2>
        <ul id="notif-list" class="feed"><li class="muted">Loading…</li></ul>
      </section>
      <section class="card">
        <h2>Clinic notices</h2>
        <iframe id="notices-frame" src="../widgets/notices.html" title="Clinic notices" class="notices-frame"></iframe>
      </section>
    </div>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/user-dashboard.js"></script>
</body>
</html>
