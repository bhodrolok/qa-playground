<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Appointments</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Main navigation"></nav>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <h1>Appointments</h1>

        <div class="toolbar">
          <select id="filter-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option>pending</option>
            <option>confirmed</option>
            <option>cancelled</option>
            <option>completed</option>
          </select>
          <input type="date" id="filter-date" aria-label="Filter by date">
          <button class="btn" id="btn-apply-filter">Apply filter</button>
          <button class="btn btn-primary" id="btn-new-appt">+ New appointment</button>
        </div>

        <section class="card hidden" id="appt-form">
          <h2>New appointment</h2>
          <div class="form-grid">
            <div><label for="appt-patient">Patient name</label><input id="appt-patient"></div>
            <div><label for="appt-date">Date</label><input id="appt-date" type="date"></div>
            <div><label for="appt-time">Time</label><input id="appt-time" type="time"></div>
            <div class="span-2"><label for="appt-reason">Reason</label>
              <input id="appt-reason" placeholder="e.g. Annual check-up"></div>
          </div>
          <p id="appt-form-error" class="error hidden"></p>
          <div class="actions">
            <button class="btn btn-primary" id="btn-save-appt">Save appointment</button>
            <button class="btn btn-ghost" id="btn-cancel-form">Close</button>
          </div>
        </section>

        <section class="card">
          <table class="table" id="appts-table">
            <thead>
              <tr><th>ID</th><th>Patient</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th>Attachment</th><th>Actions</th></tr>
            </thead>
            <tbody id="appts-body">
              <tr><td colspan="8" class="muted">Loading appointments…</td></tr>
            </tbody>
          </table>
        </section>

        <input type="file" id="row-attach-input" class="hidden">
      </main>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/staff-appointments.js"></script>
</body>
</html>
