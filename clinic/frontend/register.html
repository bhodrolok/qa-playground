<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Create an account</h1>

    <form id="register-form" novalidate>
      <label for="reg-name">Full name</label>
      <input id="reg-name" autocomplete="name">

      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" autocomplete="email">

      <label for="reg-password">Password (min 8 characters)</label>
      <input id="reg-password" type="password" autocomplete="new-password">

      <label for="reg-confirm">Confirm password</label>
      <input id="reg-confirm" type="password" autocomplete="new-password">

      <label for="reg-role">Account type</label>
      <select id="reg-role">
        <option value="user">Patient</option>
        <option value="staff">Clinic staff</option>
      </select>

      <p id="reg-error" class="error hidden"></p>
      <button id="btn-register" type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="muted">Already registered? <a href="index.html">Sign in</a></p>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
